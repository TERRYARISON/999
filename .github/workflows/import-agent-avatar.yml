name: Import Agent Avatar

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/import-agent-avatar.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror source main branch and tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --branch main --single-branch https://github.com/joyparkray/agent-avatar.git source
          cd source
          git remote add target "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"
          git push target main:main --force
          git push target --tags --force
